<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GACHU | 주문 / 결제</title>
    <link rel="stylesheet" href="style.css">
    <!-- 토스페이 결제 SDK -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <!-- Daum 우편번호 서비스 (https 명시) -->
    <script src="https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <style>
        .checkout-container { max-width: 680px; margin: 30px auto; padding: 25px; background: #fff; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .checkout-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #222; padding-bottom: 15px; margin-bottom: 20px; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .brand-logo { font-size: 22px; font-weight: bold; color: #222; text-decoration: none; }
        .back-arrow-btn { font-size: 18px; font-weight: bold; color: #222; cursor: pointer; text-decoration: none; border: 1px solid #ccc; padding: 2px 8px; border-radius: 4px; }
        .header-right-nav { display: flex; align-items: center; gap: 10px; font-size: 13px; }
        .header-right-nav a { color: #555; text-decoration: none; font-weight: 500; }
        .header-right-nav a:hover { color: #000; text-decoration: underline; }
        .header-right-nav .admin-btn { color: #2563eb; font-weight: 700; }
        .nav-divider { color: #ccc; font-size: 12px; }
        .section-title { font-size: 15px; font-weight: bold; margin: 20px 0 10px 0; color: #222; border-left: 4px solid #222; padding-left: 8px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; color: #444; }
        .btn-full { width: 100%; background: #222; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        .btn-full:hover { background: #000; }
    </style>
</head>
<body style="background:#f8f9fa;">

<div class="checkout-container">
    <div class="checkout-header">
        <div class="header-left">
            <a href="index.html" class="brand-logo">GACHU</a>
            <a href="index.html" class="back-arrow-btn" title="쇼핑몰로 돌아가기">←</a>
            <h2 style="color:#222; font-size:18px; margin:0; font-weight:bold;">주문 / 결제</h2>
        </div>
        <!-- 우측 네비게이션: 로그아웃 | 관리자 | 마이페이지 -->
        <div class="header-right-nav">
            <a href="index.html" onclick="sessionStorage.clear(); localStorage.removeItem('gachuUser');">로그아웃</a>
            <span class="nav-divider">|</span>
            <a href="admin.html" class="admin-btn">관리자</a>
            <span class="nav-divider">|</span>
            <a href="mypage.html">마이페이지</a>
        </div>
    </div>

    <!-- 주문 상품 요약 -->
    <div class="section-title">주문 상품 정보</div>
    <div id="orderSummary" style="background:#f9f9f9; padding:15px; border-radius:6px; font-weight:bold; margin-bottom:20px;">
        불러오는 중...
    </div>

    <!-- 배송지 입력 & 주소 무결성 검증 -->
    <div class="section-title">배송지 정보 입력</div>
    <form onsubmit="handlePaySubmit(event)">
        <div class="form-group">
            <label>수령인 이름</label>
            <input type="text" id="shipName" class="input-text" placeholder="홍길동" required style="width:100%; padding:10px; box-sizing:border-box;">
        </div>
        <div class="form-group">
            <label>연락처 (휴대폰 번호)</label>
            <input type="tel" id="shipPhone" class="input-text" placeholder="010-1234-5678" pattern="01[016789]-?[0-9]{3,4}-?[0-9]{4}" required style="width:100%; padding:10px; box-sizing:border-box;">
        </div>
        <div class="form-group">
            <label>우편번호 검증</label>
            <div style="display:flex; gap:6px;">
                <input type="text" id="shipPostcode" class="input-text" placeholder="우편번호" readonly required style="flex:1; padding:10px; background:#eee; box-sizing:border-box;">
                <button type="button" class="btn btn-black" onclick="execDaumPostcode()" style="padding:10px 14px; background:#222; color:#fff; border:none; cursor:pointer; border-radius:4px;">주소 검색</button>
            </div>
        </div>
        <div class="form-group">
            <label>기본 주소</label>
            <input type="text" id="shipAddress" class="input-text" placeholder="주소 검색 버튼을 눌러주세요" readonly required style="width:100%; padding:10px; background:#eee; box-sizing:border-box;">
        </div>
        <div class="form-group">
            <label>상세 주소</label>
            <input type="text" id="shipDetailAddress" class="input-text" placeholder="101동 202호 (선택 입력)" style="width:100%; padding:10px; box-sizing:border-box;">
        </div>

        <div style="margin: 25px 0 15px 0; text-align: right; font-size: 18px; font-weight: bold;">
            최종 결제 금액: <span id="totalPayPrice" style="color:#222;">0원</span>
        </div>

        <button type="submit" class="btn btn-black btn-full" style="padding:12px; font-size:15px; font-weight:bold;">토스페이 결제하기</button>
    </form>
</div>

<script>
    const TOSS_CLIENT_KEY = "test_ck_pP2YxJ4K87EO0RKdxvZmVRGZwXLO";
    let orderData = JSON.parse(sessionStorage.getItem("checkoutOrder")) || { name: "상품", price: 0 };

    window.onload = () => {
        document.getElementById("orderSummary").innerText = `${orderData.name} (${orderData.price.toLocaleString()}원)`;
        document.getElementById("totalPayPrice").innerText = `${orderData.price.toLocaleString()}원`;
    };

    function execDaumPostcode() {
        if (typeof daum === 'undefined' || !daum.Postcode) {
            alert("주소 검색 라이브러리를 불러오는 중입니다. 잠시 후 다시 시도해주세요.");
            return;
        }
        new daum.Postcode({
            oncomplete: function(data) {
                let addr = data.userSelectedType === 'R' ? data.roadAddress : data.jibunAddress;
                document.getElementById('shipPostcode').value = data.zonecode;
                document.getElementById('shipAddress').value = addr;
                document.getElementById('shipDetailAddress').focus();
            }
        }).open();
    }

    function handlePaySubmit(e) {
        e.preventDefault();
        const postcode = document.getElementById("shipPostcode").value;
        if (!postcode) {
            alert("[주소 검색] 버튼을 이용해 올바른 주소를 검증해주세요.");
            return;
        }

        const history = JSON.parse(localStorage.getItem("gachuOrders") || "[]");
        history.push({
            name: orderData.name,
            price: orderData.price,
            date: new Date().toLocaleDateString()
        });
        localStorage.setItem("gachuOrders", JSON.stringify(history));

        const currentDir = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
        const successUrl = `${currentDir}/mypage.html`;
        const failUrl = window.location.href;

        try {
            const tossPayments = TossPayments(TOSS_CLIENT_KEY);
            tossPayments.requestPayment('카드', {
                amount: Number(orderData.price),
                orderId: "ORDER_" + Date.now(),
                orderName: orderData.name.replace(/[^a-zA-Z0-9가-힣\s]/g, "") || "GACHU_GOODS",
                successUrl: successUrl,
                failUrl: failUrl
            });
        } catch(err) {
            alert("결제창 호출 오류: " + err.message);
        }
    }
</script>
</body>
</html>
