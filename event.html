<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 - 가챠박스</title>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }
        .empty-box {
            text-align: center;
            padding: 40px 60px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .empty-icon { font-size: 48px; margin-bottom: 16px; }
        h2 { margin: 0 0 8px 0; font-size: 20px; color: #222; }
        p { margin: 0; color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="empty-box">
        <div class="empty-icon">🎁</div>
        <h2>진행 중인 이벤트가 없습니다.</h2>
        <p>조만간 더 풍성하고 재미있는 이벤트로 찾아올게요!</p>
    </div>
</body>
</html>
